
services:
  - type: web
    name: todo-task-manager
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: NODE_VERSION
        value: 20.11.0
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: todo-task-manager-db
          property: connectionString

databases:
  - name: todo-task-manager-db
    databaseName: todo_db
    user: todo_user
    plan: free
