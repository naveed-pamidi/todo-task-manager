<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #f4f5fa; --panel: #ffffff; --text: #0b1a4a; --muted: #7a8099;
      --border: #ececf3; --head: #f6f6f9; --navy: #0b1a4a; --lilac: #cdb8f5;
    }
    body.dark {
      --bg: #12162b; --panel: #1c2140; --text: #e8eaf6; --muted: #9aa0c0;
      --border: #2a3055; --head: #232a50;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; align-items: flex-start; min-height: 100vh;
      font-family: 'Lexend', system-ui, sans-serif; background: var(--bg); color: var(--text);
    }
    button { font-family: inherit; cursor: pointer; }
    [hidden] { display: none !important; }

    /* ---------- sidebar ---------- */
    .sidebar {
      position: sticky; top: 0; height: 100vh; width: 84px; flex-shrink: 0;
      background: var(--navy); display: flex; flex-direction: column;
      align-items: center; padding: 24px 0; gap: 28px;
    }
    .logo { width: 48px; height: 48px; border-radius: 14px; background: var(--lilac); color: #111; font-weight: 700; display: grid; place-items: center; }
    .side-nav { display: flex; flex-direction: column; gap: 14px; }
    .nav-btn { background: none; border: none; color: #aab3d6; padding: 12px; border-radius: 12px; display: grid; place-items: center; }
    .nav-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
    .nav-btn.active { background: var(--lilac); color: var(--navy); }
    .sidebar-bottom { margin-top: auto; }

    /* ---------- content ---------- */
    .content { flex: 1; min-width: 0; padding: 20px 40px 40px; }
    h1 { font-size: 32px; margin: 8px 0 24px; }

    /* ---------- navbar ---------- */
    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 20px; }
    .icon-btn { background: none; border: none; color: var(--text); position: relative; padding: 6px 8px; font-size: 20px; display: grid; place-items: center; }
    .icon-btn:disabled { opacity: .3; cursor: not-allowed; }
    .bell-count { position: absolute; top: -4px; right: -2px; background: #e0496b; color: #fff; font-size: 10px; border-radius: 999px; padding: 1px 6px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--lilac); color: #111; font-weight: 700; font-size: 13px; }
    .dropdown-wrap { position: relative; }
    .dropdown { position: absolute; right: 0; top: 46px; min-width: 250px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.14); z-index: 20; overflow: hidden; }
    .dd-item { padding: 11px 14px; font-size: 14px; }
    .dd-item small { color: var(--muted); display: block; margin-top: 2px; }
    .dd-item:hover { background: var(--head); }

    /* ---------- tabs ---------- */
    .tabs { display: flex; gap: 28px; margin-bottom: 22px; }
    .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 6px 0; font-size: 16px; color: var(--muted); }
    .tab.active { color: var(--text); font-weight: 500; border-bottom-color: var(--text); }

    /* ---------- toolbar ---------- */
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
    .toolbar input[type=search] { flex: 1; min-width: 0; }
    input, select, textarea {
      font-family: inherit; font-size: 14px; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--panel); color: var(--text);
    }
    input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--lilac); outline-offset: 1px; }
    .btn { border: none; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 500; }
    .btn-dark { background: var(--navy); color: #fff; }
    body.dark .btn-dark { background: var(--lilac); color: #111; }
    .btn-light { background: var(--head); color: var(--text); }

    .message { padding: 10px 14px; border-radius: 10px; background: #dcf7e6; color: #1b7a43; margin-bottom: 14px; font-size: 14px; }
    .message.err { background: #fde4ea; color: #c23356; }

    /* ---------- table ---------- */
    .table-wrap { background: var(--panel); border-radius: 14px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th { background: var(--head); color: var(--muted); font-weight: 500; font-size: 13px; text-align: left; padding: 15px 16px; }
    td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--muted); vertical-align: middle; }
    td.title { color: var(--text); font-weight: 500; }
    tr.done td.title { text-decoration: line-through; color: var(--muted); }
    td.overdue { color: #c23356; }
    .badge-overdue { margin-left: 8px; background: #fde4ea; color: #c23356; font-size: 10px; padding: 2px 8px; border-radius: 999px; }
    .empty { text-align: center; color: var(--muted); padding: 32px 0; margin: 0; }

    .pill { display: inline-block; padding: 4px 14px; border-radius: 999px; font-size: 12px; }
    .p-High { background: #fde4ea; color: #e0496b; }
    .p-Medium { background: #fff1d6; color: #c98a0a; }
    .p-Low { background: #e3f3ff; color: #2f86c9; }
    .s-Pending { background: #e3effd; color: #3b7ddd; }
    .s-Completed { background: #dcf7e6; color: #22a35a; }

    td.actions { white-space: nowrap; }
    td.actions button { width: 30px; height: 30px; border: none; border-radius: 8px; margin-right: 6px; display: inline-grid; place-items: center; }
    .a-done { background: #e3effd; color: #3b7ddd; }
    .a-edit { background: #efe8fd; color: #8a5fe0; }
    .a-del { background: #fde4ea; color: #e0496b; }

    /* ---------- footer ---------- */
    .table-footer { display: flex; justify-content: flex-end; align-items: center; gap: 20px; margin-top: 20px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
    .table-footer select { padding: 8px 12px; }

    /* ---------- stats ---------- */
    .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
    .stat-card { background: var(--panel); padding: 26px; border-radius: 14px; }
    .stat-card h2 { margin: 0 0 4px; font-size: 36px; }
    .stat-card p { margin: 0; color: var(--muted); }

    /* ---------- modal ---------- */
    .modal { position: fixed; inset: 0; background: rgba(11,26,74,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
    .modal-box { background: var(--panel); border-radius: 16px; padding: 28px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; }
    .modal-box h2 { margin: 0 0 16px; }
    .modal-box label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    .modal-box input[type=text], .modal-box textarea { width: 100%; }
    .modal-box .row { display: flex; gap: 12px; }
    .modal-box .row > div { flex: 1; min-width: 0; }
    .modal-box .row input, .modal-box .row select { width: 100%; }
    .error { color: #c23356; font-size: 12px; display: block; min-height: 14px; margin-top: 4px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

    @media (max-width: 700px) {
      .content { padding: 16px; }
      .toolbar { flex-wrap: wrap; }
      .tabs { gap: 16px; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">TM</div>
    <nav class="side-nav">
      <button class="nav-btn active" data-view="home" title="Tasks"><i data-lucide="home"></i></button>
      <button class="nav-btn" data-view="stats" title="Statistics"><i data-lucide="pie-chart"></i></button>
    </nav>
    <button class="nav-btn sidebar-bottom" id="themeToggle" title="Dark mode"><i data-lucide="moon"></i></button>
  </aside>

  <main class="content">
    <!-- NAVBAR -->
    <header class="topbar">
      <button class="icon-btn" id="searchBtn" title="Search"><i data-lucide="search"></i></button>

      <div class="dropdown-wrap">
        <button class="icon-btn" id="bellBtn" title="Notifications">
          <i data-lucide="bell"></i><span id="bellCount" class="bell-count" hidden>0</span>
        </button>
        <div class="dropdown" id="bellMenu" hidden></div>
      </div>

      <div class="dropdown-wrap">
        <button class="avatar" id="avatarBtn" title="Account">TM</button>
        <div class="dropdown" id="avatarMenu" hidden>
          <div class="dd-item">Task Manager User</div>
        </div>
      </div>
    </header>

    <!-- VIEW: TASKS -->
    <section id="view-home" class="view">
      <h1>My Tasks</h1>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-filter="all">All Tasks</button>
        <button class="tab" data-filter="Pending">Pending</button>
        <button class="tab" data-filter="Completed">Completed</button>
        <button class="tab" data-filter="overdue">Overdue</button>
      </nav>

      <div class="toolbar">
        <input type="search" id="search" placeholder="Search tasks...">
        <select id="priorityFilter">
          <option value="">All priorities</option>
          <option>Low</option><option>Medium</option><option>High</option>
        </select>
        <button class="btn btn-dark" id="newBtn">+ Create New Task</button>
      </div>

      <div id="message" class="message" hidden></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Title</th><th>Description</th><th>Priority</th><th>Status</th><th>Deadline</th><th>Actions</th></tr>
          </thead>
          <tbody id="taskBody"></tbody>
        </table>
        <p id="empty" class="empty" hidden>No tasks found.</p>
      </div>

      <!-- FOOTER / PAGINATION -->
      <footer class="table-footer">
        <label>Rows per page:
          <select id="rowsPerPage"><option>5</option><option selected>10</option><option>20</option></select>
        </label>
        <span id="pageInfo">0 of 0</span>
        <button class="icon-btn" id="prevPage" title="Previous page">‹</button>
        <button class="icon-btn" id="nextPage" title="Next page">›</button>
      </footer>
    </section>

    <!-- VIEW: STATISTICS -->
    <section id="view-stats" class="view" hidden>
      <h1>Statistics</h1>
      <div class="stat-cards" id="statCards"></div>
    </section>
  </main>

  <!-- Add / Edit modal -->
  <div class="modal" id="modal" hidden>
    <form class="modal-box" id="taskForm" novalidate>
      <h2 id="modalTitle">Create Task</h2>
      <input type="hidden" id="taskId">

      <label for="title">Title *</label>
      <input type="text" id="title" maxlength="200">
      <small class="error" id="titleError"></small>

      <label for="description">Description</label>
      <textarea id="description" rows="3"></textarea>

      <div class="row">
        <div><label for="deadline">Deadline</label><input type="date" id="deadline"></div>
        <div><label for="priority">Priority</label>
          <select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select>
        </div>
        <div><label for="status">Status</label>
          <select id="status"><option>Pending</option><option>Completed</option></select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-light" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-dark">Save</button>
      </div>
    </form>
  </div>

  <script>
    const API = 'http://127.0.0.1:8000/api/tasks/';
    let currentFilter = 'all';
    let allTasks = [];
    let page = 1;
    let perPage = 10;

    const $ = (id) => document.getElementById(id);
    const body = $('taskBody');

    // ---------- helpers ----------
    function showMessage(text, isError = false) {
      const m = $('message');
      m.textContent = text;
      m.className = 'message' + (isError ? ' err' : '');
      m.hidden = false;
      setTimeout(() => (m.hidden = true), 3000);
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str ?? '';
      return d.innerHTML;
    }

    async function api(url, method = 'GET', data) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (data) opts.body = JSON.stringify(data);
      const res = await fetch(url, opts);
      const json = res.status === 204 ? null : await res.json();
      if (!res.ok) throw { status: res.status, data: json };
      return json;
    }

    // ---------- load & render ----------
    async function loadTasks() {
      const params = new URLSearchParams();
      if (currentFilter === 'overdue') params.set('overdue', 'true');
      else if (currentFilter !== 'all') params.set('status', currentFilter);
      if ($('search').value.trim()) params.set('search', $('search').value.trim());
      if ($('priorityFilter').value) params.set('priority', $('priorityFilter').value);

      try {
        allTasks = await api(API + '?' + params);
        render();
        updateBell();
      } catch (e) {
        showMessage('Could not load tasks. Is the server running?', true);
      }
    }

    function render() {
      const total = allTasks.length;
      const pages = Math.max(1, Math.ceil(total / perPage));
      page = Math.min(page, pages);
      const start = (page - 1) * perPage;
      const tasks = allTasks.slice(start, start + perPage);

      $('empty').hidden = total > 0;
      body.innerHTML = tasks.map((t) => `
        <tr class="${t.status === 'Completed' ? 'done' : ''}">
          <td class="title">${escapeHtml(t.title)}</td>
          <td>${escapeHtml(t.description) || '—'}</td>
          <td><span class="pill p-${t.priority}">${t.priority}</span></td>
          <td><span class="pill s-${t.status}">${t.status}</span></td>
          <td class="${t.is_overdue ? 'overdue' : ''}">
            ${t.deadline || '—'}${t.is_overdue ? '<span class="badge-overdue">OVERDUE</span>' : ''}
          </td>
          <td class="actions">
            <button class="a-done" data-act="toggle" data-id="${t.id}" title="${t.status === 'Pending' ? 'Mark completed' : 'Mark pending'}"><i data-lucide="${t.status === 'Pending' ? 'check' : 'undo-2'}"></i></button>
            <button class="a-edit" data-act="edit" data-id="${t.id}" title="Edit"><i data-lucide="pencil"></i></button>
            <button class="a-del" data-act="delete" data-id="${t.id}" title="Delete"><i data-lucide="trash-2"></i></button>
          </td>
        </tr>`).join('');
      lucide.createIcons();

      $('pageInfo').textContent = total ? `${start + 1}-${Math.min(start + perPage, total)} of ${total}` : '0 of 0';
      $('prevPage').disabled = page === 1;
      $('nextPage').disabled = page === pages;
    }

    // row action buttons (one listener for the whole table)
    body.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      const task = allTasks.find((t) => t.id === id);
      if (btn.dataset.act === 'toggle') toggleStatus(id, task.status);
      else if (btn.dataset.act === 'edit') openModal(task);
      else if (btn.dataset.act === 'delete') deleteTask(id);
    });

    // ---------- actions ----------
    async function toggleStatus(id, status) {
      try {
        await api(`${API}${id}/`, 'PATCH', { status: status === 'Pending' ? 'Completed' : 'Pending' });
        loadTasks();
      } catch (e) { showMessage('Could not update the task.', true); }
    }

    async function deleteTask(id) {
      if (!confirm('Delete this task?')) return;
      try {
        await api(`${API}${id}/`, 'DELETE');
        showMessage('Task deleted.');
        loadTasks();
      } catch (e) { showMessage('Could not delete the task.', true); }
    }

    // ---------- modal ----------
    function openModal(task = null) {
      $('titleError').textContent = '';
      $('modalTitle').textContent = task ? 'Edit Task' : 'Create Task';
      $('taskId').value = task ? task.id : '';
      $('title').value = task ? task.title : '';
      $('description').value = task ? task.description : '';
      $('deadline').value = task && task.deadline ? task.deadline : '';
      $('priority').value = task ? task.priority : 'Medium';
      $('status').value = task ? task.status : 'Pending';
      $('modal').hidden = false;
      $('title').focus();
    }
    const closeModal = () => ($('modal').hidden = true);

    $('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('titleError').textContent = '';

      if (!$('title').value.trim()) {
        $('titleError').textContent = 'Task title cannot be empty.';
        return;
      }

      const id = $('taskId').value;
      const payload = {
        title: $('title').value.trim(),
        description: $('description').value.trim(),
        deadline: $('deadline').value || null,
        priority: $('priority').value,
        status: $('status').value,
      };

      try {
        await api(id ? `${API}${id}/` : API, id ? 'PUT' : 'POST', payload);
        closeModal();
        showMessage(id ? 'Task updated.' : 'Task created.');
        loadTasks();
      } catch (err) {
        const msg = err.data && err.data.title ? err.data.title[0] : 'Something went wrong.';
        $('titleError').textContent = msg;
      }
    });

    // ---------- filters & tabs ----------
    $('newBtn').onclick = () => openModal();
    $('cancelBtn').onclick = closeModal;
    $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeMenus(); } });

    $('priorityFilter').onchange = () => { page = 1; loadTasks(); };

    let timer;
    $('search').addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => { page = 1; loadTasks(); }, 300);
    });

    $('tabs').addEventListener('click', (e) => {
      if (!e.target.dataset.filter) return;
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      page = 1;
      loadTasks();
    });

    // ---------- footer (pagination) ----------
    $('rowsPerPage').onchange = (e) => { perPage = +e.target.value; page = 1; render(); };
    $('prevPage').onclick = () => { page--; render(); };
    $('nextPage').onclick = () => { page++; render(); };

    // ---------- navbar ----------
    $('searchBtn').onclick = () => { showView('home'); $('search').focus(); };

    async function updateBell() {
      try {
        const all = await api(API);
        const soon = new Date(Date.now() + 2 * 86400000);
        const alerts = all.filter((t) =>
          t.status !== 'Completed' && (t.is_overdue || (t.deadline && new Date(t.deadline) <= soon)));
        $('bellCount').textContent = alerts.length;
        $('bellCount').hidden = alerts.length === 0;
        $('bellMenu').innerHTML = alerts.length
          ? alerts.map((t) => `<div class="dd-item">${escapeHtml(t.title)}<small>${t.is_overdue ? 'Overdue' : 'Due ' + t.deadline}</small></div>`).join('')
          : '<div class="dd-item">No notifications</div>';
      } catch (e) { /* server down; loadTasks already shows the error */ }
    }

    function closeMenus() { $('bellMenu').hidden = true; $('avatarMenu').hidden = true; }
    function toggleMenu(id) { const wasHidden = $(id).hidden; closeMenus(); $(id).hidden = !wasHidden; }
    $('bellBtn').onclick = (e) => { e.stopPropagation(); toggleMenu('bellMenu'); };
    $('avatarBtn').onclick = (e) => { e.stopPropagation(); toggleMenu('avatarMenu'); };
    document.addEventListener('click', closeMenus);

    // ---------- sidebar ----------
    function showView(name) {
      document.querySelectorAll('.nav-btn[data-view]').forEach((b) => b.classList.toggle('active', b.dataset.view === name));
      document.querySelectorAll('.view').forEach((v) => (v.hidden = v.id !== 'view-' + name));
      if (name === 'stats') renderStats();
    }
    document.querySelectorAll('.nav-btn[data-view]').forEach((b) => (b.onclick = () => showView(b.dataset.view)));

    async function renderStats() {
      try {
        const all = await api(API);
        const cards = {
          Total: all.length,
          Pending: all.filter((t) => t.status === 'Pending').length,
          Completed: all.filter((t) => t.status === 'Completed').length,
          Overdue: all.filter((t) => t.is_overdue).length,
        };
        $('statCards').innerHTML = Object.entries(cards)
          .map(([k, v]) => `<div class="stat-card"><h2>${v}</h2><p>${k}</p></div>`).join('');
      } catch (e) {
        showMessage('Could not load statistics.', true);
      }
    }

    // dark mode (remembered between visits)
    try { if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark'); } catch (e) {}
    $('themeToggle').onclick = () => {
      document.body.classList.toggle('dark');
      try { localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); } catch (e) {}
    };

    lucide.createIcons();
    loadTasks();
  </script>
</body>
</html>
